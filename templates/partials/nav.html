<!-- =========================
     Right Side Controls
========================== -->

<div class="d-flex align-items-center ms-lg-3 gap-2 flex-wrap">
  <!-- Search -->

  <form
    action="{{ url_for('search') }}"
    method="GET"
    class="wiki-search-form d-flex align-items-center"
  >
    <div class="input-group input-group-sm">
      <span
        class="input-group-text bg-transparent border-secondary text-secondary"
      >
        <i class="bi bi-search"></i>
      </span>

      <input
        type="text"
        name="q"
        class="form-control"
        placeholder="Search database..."
        required
      />

      <button class="btn btn-outline-light border-secondary" type="submit">
        Go
      </button>
    </div>
  </form>

  <!-- =========================
         Theme Toggle
    ========================== -->

  <button
    id="themeToggle"
    class="btn btn-outline-light d-flex align-items-center justify-content-center"
    type="button"
    aria-label="Toggle theme"
    title="Toggle Dark / Light Mode"
  >
    <i id="themeIcon" class="bi bi-moon-stars-fill"></i>
  </button>
</div>
