<!-- =========================
Right Side Controls
========================== -->

<div class="d-flex align-items-center ms-lg-3 gap-2 flex-wrap">
  <!-- Live Search -->

  <form
    action="{{ url_for('search') }}"
    method="GET"
    class="wiki-search-form navbar-search"
    autocomplete="off"
  >
    <div class="search-container">
      <div class="search-wrapper">
        <i class="bi bi-search search-icon"></i>

        <input
          id="liveSearch"
          type="text"
          name="q"
          class="form-control search-input"
          placeholder="Search The Silk Web..."
          autocomplete="off"
        />

        <button class="search-button" type="submit">Go</button>
      </div>

      <!-- Live Suggestions Dropdown -->

      <div id="searchResults" class="search-results"></div>
    </div>
  </form>

  <!-- Theme Toggle -->

  <button
    id="themeToggle"
    class="btn btn-outline-light d-flex align-items-center justify-content-center"
    type="button"
    aria-label="Toggle theme"
    title="Toggle Dark / Light Mode"
  >
    <i id="themeIcon" class="bi bi-moon-stars-fill"></i>
  </button>
</div>
