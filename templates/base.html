<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}The Silk Web{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <!-- Main CSS -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />

    {% block extra_css %}{% endblock %}

    <style>
      main {
        padding-top: 76px;
      }
    </style>
  </head>

  <body>
    <!-- =========================
         Navigation
    ========================== -->

    <nav
      id="mainNavbar"
      class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top border-bottom border-secondary shadow-sm"
    >
      <div class="container">
        <!-- Logo -->
        <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">
          The Silk Web
        </a>

        <!-- Mobile Toggle -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navigation Links -->
        <div class="collapse navbar-collapse" id="navbarNav">
          {% include "partials/nav.html" %}
        </div>
      </div>
    </nav>

    <!-- =========================
         Main Content
    ========================== -->

    <main>{% block content %} {% endblock %}</main>

    <!-- =========================
         Footer
    ========================== -->

    <footer class="text-center py-4 mt-5">
      <small class="opacity-75">
        The Silk Web • Fan-made Hollow Knight: Silksong Database
      </small>
    </footer>

    <!-- Bootstrap -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Scroll Reveal -->

    <script src="{{ url_for('static', filename='js/scroll-reveal.js') }}"></script>

    <!-- Theme System -->

    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>

    {% block extra_js %} {% endblock %}
  </body>
</html>
