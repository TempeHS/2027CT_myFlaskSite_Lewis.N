<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ==================================
         INSTANT THEME LOADER
         Prevents theme flashing
    =================================== -->

    <script>
      (function () {
        const savedTheme = localStorage.getItem("silkweb-theme");

        if (savedTheme) {
          document.documentElement.dataset.theme = savedTheme;
        } else {
          const systemTheme = window.matchMedia("(prefers-color-scheme: dark)")
            .matches
            ? "dark"
            : "light";

          document.documentElement.dataset.theme = systemTheme;

          localStorage.setItem("silkweb-theme", systemTheme);
        }
      })();
    </script>

    <title>{% block title %} The Silk Web {% endblock %}</title>

    <!-- ==================================
         BOOTSTRAP CSS
    =================================== -->

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- ==================================
         BOOTSTRAP ICONS
    =================================== -->

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <!-- ==================================
         MAIN WEBSITE CSS
    =================================== -->

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />

    {% block extra_css %} {% endblock %}

    <style>
      main {
        padding-top: 76px;
      }
    </style>
  </head>

  <body>
    <!-- ==================================
             NAVBAR
    =================================== -->

    <nav
      id="mainNavbar"
      class="navbar navbar-expand-lg fixed-top border-bottom border-secondary shadow-sm"
    >
      <div class="container">
        <!-- Website Logo -->

        <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">
          The Silk Web
        </a>

        <!-- Mobile Navbar Button -->

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navbar Links -->

        <div class="collapse navbar-collapse" id="navbarNav">
          {% include "partials/nav.html" %}
        </div>
      </div>
    </nav>

    <!-- ==================================
             PAGE CONTENT
    =================================== -->

    <main>{% block content %} {% endblock %}</main>

    <!-- ==================================
             FOOTER
    =================================== -->

    <footer class="text-center py-4 mt-5">
      <small class="opacity-75">
        The Silk Web • Fan-made Hollow Knight: Silksong Database
      </small>
    </footer>

    <!-- ==================================
             JAVASCRIPT
    =================================== -->

    <!-- Bootstrap -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Scroll Reveal -->

    <script src="{{ url_for('static', filename='js/scroll-reveal.js') }}"></script>

    <!-- Theme System -->

    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>

    <!-- Live Search + Extra Features -->

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

    {% block extra_js %} {% endblock %}
  </body>
</html>
