<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}The Silk Web{% endblock %}</title>

    <!-- Bootstrap CSS from CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Your custom CSS -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    {% block extra_css %}{% endblock %}

    <!-- Fix overlap layout issue -->
    <style>
      main {
        padding-top: 76px; /* Pushes content down so the fixed top navbar doesn't cover it */
      }
    </style>
  </head>
  <body>
    <!-- Bootstrap Navbar Frame Container Wrap -->
    <nav
      class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top border-bottom border-secondary shadow-sm"
    >
      <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('home') }}"
          >The Silk Web</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          {% include 'partials/nav.html' %}
        </div>
      </div>
    </nav>

    <main>
      {% block content %}
      <!-- Page content goes here -->
      {% endblock %}
    </main>

    <!-- Bootstrap JavaScript from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Global Scroll Reveal Script -->
    <script src="{{ url_for('static', filename='js/scroll-reveal.js') }}"></script>

    {% block extra_js %}{% endblock %}
  </body>
</html>
